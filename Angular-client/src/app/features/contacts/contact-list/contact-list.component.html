<div class="p-8">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Contacts</h1>
      <p class="text-gray-500 mt-1">Manage your contact database and targeting preferences</p>
    </div>
    <button
      (click)="openAddContactModal()"
      class="bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition-colors duration-300 ease-in-out hover:bg-purple-700 flex items-center space-x-2"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Add Contact</span>
    </button>
  </div>

  <!-- Search + Filters -->
  <div class="flex items-center space-x-4 mb-8">
    <div class="flex items-center w-full bg-white rounded-lg shadow-sm border border-gray-200 px-4 py-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" placeholder="Search contacts by name..." class="w-full text-gray-700 focus:outline-none placeholder-gray-400"/>
    </div>
    <button class="bg-white text-gray-500 font-semibold py-2 px-4 rounded-lg shadow-sm border border-gray-200 transition-colors duration-200 ease-in-out hover:bg-gray-100 flex items-center space-x-2 whitespace-nowrap">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Filters</span>
    </button>
  </div>

  <!-- Contact Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let contact of contacts" class="bg-white p-6 rounded-lg shadow-md border border-gray-200 relative transition-all duration-300 ease-in-out hover:shadow-lg hover:-translate-y-1 hover:bg-gray-50">
      <!-- Contact Info -->
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-gray-900">{{ contact.name }}</h3>
      </div>
      <p class="text-sm text-gray-500 mb-2">📞 {{ contact.phoneNumber }}</p>
      <div class="flex items-center space-x-2 mb-2">
        <span *ngFor="let tag of contact.tags" class="text-xs px-2 py-1 rounded-full bg-purple-100 text-purple-700">
          {{ tag }}
        </span>
      </div>

      <div class="flex justify-between items-center mt-4">
        <button (click)="openContactDetails(contact)" class="text-sm font-semibold text-purple-600 hover:text-purple-800 transition-colors duration-200">
          More details →
        </button>
        <div class="flex space-x-2">
          <button (click)="openEditContact(contact)" class="p-2 rounded-md hover:bg-gray-100 text-gray-500 hover:text-violet-600" title="Edit Contact">
            <i class="fas fa-pen w-5 h-5"></i>
          </button>
          <button (click)="deleteContact(contact)" class="p-2 rounded-md hover:bg-gray-100 text-gray-500 hover:text-red-600" title="Delete Contact">
            <i class="fas fa-trash w-5 h-5"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Unified Contact Modal -->
<div *ngIf="showContactModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 relative">
    <button (click)="closeContactModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">✖</button>

    <!-- Add / Edit Contact -->
    <ng-container *ngIf="modalMode === 'add' || modalMode === 'edit'">
      <h2 class="text-2xl font-bold text-gray-900 mb-4" *ngIf="modalMode==='add'">Add New Contact</h2>
      <h2 class="text-2xl font-bold text-gray-900 mb-4" *ngIf="modalMode==='edit'">Edit Contact</h2>
      <form (ngSubmit)="modalMode==='add' ? saveContact() : updateContact()">
        <div class="mb-4" *ngFor="let field of ['name','phoneNumber','tags']">
          <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.charAt(0).toUpperCase() + field.slice(1) }}</label>
          <input type="text" [(ngModel)]="contactForm[field]" name="{{modalMode}}{{field}}" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"/>
        </div>
        <div class="flex justify-end space-x-3">
          <button type="button" (click)="closeContactModal()" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">Save</button>
        </div>
      </form>
    </ng-container>

    <!-- Contact Details -->
    <ng-container *ngIf="modalMode === 'details' && selectedContact">
      <h2 class="text-2xl font-bold text-gray-900 mb-4">{{ selectedContact.name }}</h2>
      <p class="text-gray-600 mb-2">📞 {{ selectedContact.phoneNumber }}</p>
      <div class="flex flex-wrap gap-2 mb-4">
        <span *ngFor="let tag of selectedContact.tags" class="px-2 py-1 text-xs bg-purple-100 text-purple-700 rounded-full">{{ tag }}</span>
      </div>
      <div class="flex justify-end space-x-3 mt-6">
        <button (click)="openEditContact(selectedContact)" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100">Edit</button>
        <button (click)="deleteContact(selectedContact)" class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-red-700">Delete</button>
      </div>
    </ng-container>
  </div>
</div>
