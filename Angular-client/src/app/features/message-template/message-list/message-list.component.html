<div class="p-8">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Message Templates</h1>
      <p class="text-gray-500 mt-1">
        Create, edit and manage your email templates for campaigns
      </p>
    </div>
    <button
      *ngIf="userRole === 'Editor'"
      (click)="openAddTemplateModal()" 
      class="bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition-colors duration-300 ease-in-out hover:bg-purple-700 flex items-center space-x-2"
    ><i class="fa-solid fa-plus"></i>
      <span>New Template</span>
    </button>
  </div>

  <div class="flex items-center mb-8">
    <div
      class="flex items-center w-full bg-white rounded-lg shadow-sm border border-gray-200 px-4 py-2"
    >
      <i class="fa-solid fa-search text-gray-400 mr-3"></i>
      <input
        type="text"
        placeholder="Search templates by name or type..."
        class="w-full text-gray-700 focus:outline-none placeholder-gray-400"
        [(ngModel)]="searchTerm"
        (input)="onSearchChange()"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div
      *ngFor="let template of templates"
      class="bg-white p-6 rounded-lg shadow-md border border-gray-200 relative group cursor-pointer hover:shadow-lg transition"
      (click)="openTemplateDetails(template)"
    >
      <div class="flex justify-between items-start mb-2">
        <h3 class="font-bold text-gray-900">{{ template.name }}</h3>
        <span
          class="text-xs font-semibold px-2 py-1 rounded-full whitespace-nowrap"
          [ngClass]="{
            'bg-blue-100 text-blue-800': template.type === 'Text',
            'bg-purple-100 text-purple-800': template.type === 'Text-Image'
          }"
        >
          {{ template.type }}
        </span>
      </div>

      <p class="text-sm text-gray-700 leading-relaxed mb-4">
        {{ template.message.text }}
      </p>
      
      <div *ngIf="template.message.imageUrl">
        <img [src]="template.message.imageUrl" alt="Template Image" class="w-full h-auto rounded-lg mt-2"/>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="showTemplateModal"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
>
  <div class="bg-white rounded-xl shadow-lg w-full max-w-lg p-6 relative">
    <button
      (click)="closeTemplateModal()"
      class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"
    ><i class="fa-solid fa-times"></i></button>

    <ng-container *ngIf="modalMode === 'add' || modalMode === 'edit'">
      <h2
        class="text-2xl font-bold text-gray-900 mb-4"
        *ngIf="modalMode === 'add'"
      >
        Add New Template
      </h2>
      <h2
        class="text-2xl font-bold text-gray-900 mb-4"
        *ngIf="modalMode === 'edit'"
      >
        Edit Template
      </h2>
      <form
        (ngSubmit)="modalMode === 'add' ? saveTemplate() : updateTemplate()"
      >
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Name</label
          >
          <input
            type="text"
            [(ngModel)]="templateForm.name"
            name="name"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Type</label
          >
          <select
            [(ngModel)]="templateForm.type"
            name="type"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
          >
            <option value="Text">Text</option>
            <option value="Text-Image">Text-Image</option>
          </select>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Message</label
          >
          <textarea
            [(ngModel)]="templateForm.messageText"
            name="messageText"
            required
            rows="3"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
          ></textarea>
        </div>

        <div class="mb-6" *ngIf="templateForm.type === 'Text-Image'">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Image URL</label
          >
          <input
            type="text"
            [(ngModel)]="templateForm.messageImageUrl"
            name="messageImageUrl"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
          />
        </div>
        
        <div class="flex justify-end space-x-3">
          <button
            type="button"
            (click)="closeTemplateModal()"
            class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700"
          >
            Save
          </button>
        </div>
      </form>
    </ng-container>

    <ng-container *ngIf="modalMode === 'details' && selectedTemplate">
      <h2 class="text-2xl font-bold text-gray-900 mb-4">
        {{ selectedTemplate.name }}
      </h2>
      <span
        class="inline-block px-2 py-1 text-xs font-semibold rounded-full mb-4"
        [ngClass]="{
          'bg-blue-100 text-blue-800': selectedTemplate.type === 'Text',
          'bg-purple-100 text-purple-800':
            selectedTemplate.type === 'Text-Image'
        }"
      >
        {{ selectedTemplate.type }}
      </span>

      <p class="text-gray-700 mb-6 p-4 bg-gray-50 rounded-lg">
        {{ selectedTemplate.message.text }}
      </p>

      <div *ngIf="selectedTemplate.message.imageUrl">
        <img [src]="selectedTemplate.message.imageUrl" alt="Template Image" class="w-full h-auto rounded-lg mb-4" />
      </div>

      <div class="flex justify-end space-x-3 mt-6">
        <button *ngIf="userRole === 'Editor'" (click)="openEditTemplate(selectedTemplate)"
          (click)="openEditTemplate(selectedTemplate)"
          class="px-4 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100"
        >
          Edit
        </button>
        <button *ngIf="userRole === 'Editor'"
          (click)="deleteTemplate(selectedTemplate)"
          class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-red-700"
        >
          Delete
        </button>
      </div>
    </ng-container>
  </div>
</div>
