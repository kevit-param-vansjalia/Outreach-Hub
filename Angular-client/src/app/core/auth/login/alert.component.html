<div *ngIf="alert" @alertAnimation class="fixed top-5 right-5 z-[100] w-full max-w-sm">
  <div class="flex items-center p-4 rounded-lg shadow-lg text-white" [ngClass]="colorMap[alert.type]">
    <div class="flex-shrink-0">
      <i class="text-xl" [ngClass]="iconMap[alert.type]"></i>
    </div>
    <div class="ml-3 text-sm font-medium">
      {{ alert.message }}
    </div>
    <button (click)="closeAlert()" class="ml-auto -mx-1.5 -my-1.5 bg-white/20 text-white rounded-lg p-1.5 hover:bg-white/30 inline-flex items-center justify-center h-8 w-8">
      <span class="sr-only">Close</span>
      <i class="fa-solid fa-times"></i>
    </button>
  </div>
</div>
