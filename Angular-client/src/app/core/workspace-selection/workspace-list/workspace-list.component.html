<div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-purple-50 via-white to-pink-50">

  <!-- Animated Background -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute -top-48 -right-48 w-96 h-96 bg-purple-500 rounded-full opacity-10 animate-pulse" [@float]></div>
    <div class="absolute -bottom-48 -left-48 w-96 h-96 bg-pink-500 rounded-full opacity-10 animate-pulse" style="animation-delay: 2s;" [@float]></div>
    <div class="absolute top-1/2 right-1/4 w-32 h-32 bg-purple-400 rounded-full opacity-5 animate-bounce" style="animation-delay: 4s;" [@float]></div>
  </div>

  <!-- Centered Card -->
  <div class="w-full max-w-2xl bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-2xl relative z-10" [@slideIn]>

    <!-- Logo -->
    <div class="mb-8 flex justify-center" [@fadeIn]>
      <div class="flex items-center gap-3">
        <div class="relative w-8 h-8 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full">
          <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-5 h-5 bg-white rounded-full"></div>
        </div>
        <span class="text-xl font-semibold text-gray-900">Outreach-Hub</span>
      </div>
    </div>

    <!-- Title -->
    <div class="mb-8 text-center" [@fadeIn]>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent mb-2">Select Your Workspace</h1>
      <p class="text-gray-500">Choose the workspace you want to continue with.</p>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="flex justify-center items-center py-12">
      <div class="w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
    </div>

    <!-- No Workspaces Message -->
    <div *ngIf="!isLoading && hasNoWorkspaces" class="text-center py-12 bg-gray-50 rounded-lg" [@fadeIn]>
      <h2 class="text-xl font-bold text-gray-800 mb-2">No Workspaces Found</h2>
      <p class="text-gray-600">
        Sorry, you don’t have any workspaces assigned.<br />
        Please ask your admin to enroll you in a workspace.
      </p>
    </div>

    <!-- Workspace Grid -->
    <div *ngIf="!isLoading && !hasNoWorkspaces" class="grid grid-cols-1 md:grid-cols-2 gap-6" [@fadeIn]>
      <div
        *ngFor="let workspace of workspaces"
        (click)="selectWorkspace(workspace)"
        class="group cursor-pointer bg-white p-6 rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 border border-gray-200 hover:border-purple-500 hover:-translate-y-1"
      >
        <div class="flex items-center justify-between">
          <h3 class="text-xl font-semibold text-gray-800 group-hover:text-purple-600 transition-colors">
            {{ workspace.name }}
          </h3>
          <span class="px-3 py-1 text-xs font-bold rounded-full" [ngClass]="{
            'bg-purple-100 text-purple-700': workspace.role === 'Editor',
            'bg-gray-100 text-gray-600': workspace.role === 'Viewer'
          }">{{ workspace.role }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
