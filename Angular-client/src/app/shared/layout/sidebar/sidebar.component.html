<aside
  class="bg-white p-6 shadow-md z-10 h-screen fixed transition-all duration-300 ease-in-out overflow-hidden"
  [ngClass]="isSidebarCollapsed ? 'w-20' : 'w-64'">

  <div class="flex flex-col justify-between h-full">

    <!-- Logo + Toggle -->
    <div>
      <div class="flex items-center mb-8 relative">
        <button
          (click)="toggleSidebar()"
          class="bg-transparent border-none cursor-pointer text-gray-500 p-2 rounded-full transition-colors duration-200 ease-in-out hover:bg-gray-100 w-6 h-6 flex items-center justify-center">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>

        <div class="ml-4 transition-opacity duration-300 ease-in-out"
          [ngClass]="{'opacity-0 pointer-events-none': isSidebarCollapsed}">
          <h1 class="text-xl font-bold text-gray-900 whitespace-nowrap">Outreach Hub</h1>
          <p class="text-sm text-gray-500 whitespace-nowrap">Campaign Management</p>
        </div>
      </div>

      <!-- Main Menu -->
      <nav>
        <h2 class="text-xs text-gray-400 font-semibold uppercase mb-4 transition-opacity duration-300 ease-in-out"
          [ngClass]="{'opacity-0 pointer-events-none': isSidebarCollapsed}">
          Main Menu
        </h2>
        <ul class="list-none p-0 m-0">

          <!-- Dashboard -->
          <li class="mb-2">
            <a routerLink="/dashboard" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #dashboardRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-100"
              [ngClass]="{
                'bg-violet-50 text-violet-700 font-semibold': dashboardRla.isActive, 
                'text-gray-500': !dashboardRla.isActive,
                'p-3': !isSidebarCollapsed,
                'p-2 justify-center': isSidebarCollapsed
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-violet-700 rounded-lg"
                [ngClass]="{'hidden': !dashboardRla.isActive}"></span>
              <svg class="w-5 h-5 transition-colors duration-300 ease-in-out"
                [ngClass]="{
                  'text-violet-700': dashboardRla.isActive, 
                  'text-gray-500': !dashboardRla.isActive, 
                  'mr-3': !isSidebarCollapsed
                }"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001 1h3v-3m0 0a1 1 0 001-1V9a1 1 0 00-1-1h-3.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 00-.293.707V15a1 1 0 001 1h12m-6 0v2"></path>
              </svg>
              <span *ngIf="!isSidebarCollapsed">Dashboard</span>
            </a>
          </li>

          <!-- Contacts -->
          <li class="mb-2">
            <a routerLink="/contacts" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #contactsRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-100"
              [ngClass]="{
                'bg-violet-50 text-violet-700 font-semibold': contactsRla.isActive, 
                'text-gray-500': !contactsRla.isActive,
                'p-3': !isSidebarCollapsed,
                'p-2 justify-center': isSidebarCollapsed
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-violet-700 rounded-lg"
                [ngClass]="{'hidden': !contactsRla.isActive}"></span>
              <i class="fa-solid fa-users w-5 h-5 transition-colors duration-300 ease-in-out" [ngClass]="{
                'text-violet-700': contactsRla.isActive, 'text-gray-500': !contactsRla.isActive, 'mr-3': !isSidebarCollapsed
              }"></i>
              <span *ngIf="!isSidebarCollapsed">Contacts</span>
            </a>
          </li>

          <!-- Message Templates -->
          <li class="mb-2">
            <a routerLink="/message-template" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #templatesRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-100"
              [ngClass]="{
                'bg-violet-50 text-violet-700 font-semibold': templatesRla.isActive, 
                'text-gray-500': !templatesRla.isActive,
                'p-3': !isSidebarCollapsed,
                'p-2 justify-center': isSidebarCollapsed
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-violet-700 rounded-lg"
                [ngClass]="{'hidden': !templatesRla.isActive}"></span>
              <i class="fa-solid fa-file-alt w-5 h-5 transition-colors duration-300 ease-in-out" [ngClass]="{
                'text-violet-700': templatesRla.isActive, 'text-gray-500': !templatesRla.isActive, 'mr-3': !isSidebarCollapsed
              }"></i>
              <span *ngIf="!isSidebarCollapsed">Message Templates</span>
            </a>
          </li>

          <!-- Campaigns -->
          <li class="mb-2">
            <a routerLink="/campaign" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #campaignsRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-100"
              [ngClass]="{
                'bg-violet-50 text-violet-700 font-semibold': campaignsRla.isActive, 
                'text-gray-500': !campaignsRla.isActive,
                'p-3': !isSidebarCollapsed,
                'p-2 justify-center': isSidebarCollapsed
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-violet-700 rounded-lg"
                [ngClass]="{'hidden': !campaignsRla.isActive}"></span>
              <i class="fa-solid fa-bullhorn transition-colors duration-300 ease-in-out" [ngClass]="{
                'text-violet-700': campaignsRla.isActive, 'text-gray-500': !campaignsRla.isActive, 'mr-3 w-5 h-5': !isSidebarCollapsed,
                'w-6 h-6': isSidebarCollapsed
              }"></i>
              <span *ngIf="!isSidebarCollapsed">Campaigns</span>
            </a>
          </li>

        </ul>
      </nav>
    </div>

    <!-- System Section -->
    <div>
      <h2 class="text-xs text-gray-400 font-semibold uppercase mb-4 transition-opacity duration-300 ease-in-out"
        [ngClass]="{'opacity-0 pointer-events-none': isSidebarCollapsed}">
        System
      </h2>
      <ul class="list-none p-0 m-0">
        <li class="mb-2 relative">
          <div (click)="toggleSettingsDropdown()"
            class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-100 cursor-pointer"
            [ngClass]="{'p-3': !isSidebarCollapsed, 'p-2 justify-center': isSidebarCollapsed}">
            
            <span class="absolute left-0 top-0 h-full w-1 bg-violet-700 rounded-lg" *ngIf="isSettingsActive()"></span>
            
            <i class="fa-solid fa-cog w-5 h-5 transition-colors duration-300 ease-in-out" [ngClass]="{
              'text-violet-700': isSettingsActive(), 'text-gray-500': !isSettingsActive(), 'mr-3': !isSidebarCollapsed
            }"></i>
            <span *ngIf="!isSidebarCollapsed" class="flex-1">Settings</span>
            <i *ngIf="!isSidebarCollapsed" class="fa-solid fa-chevron-down w-4 h-4 transition-transform" [class.rotate-180]="settingsOpen"></i>
          </div>

          <!-- Dropdown Menu -->
          <div *ngIf="settingsOpen && !isSidebarCollapsed" class="pl-8 mt-1 space-y-1">
            <a (click)="switchWorkspace()" class="flex items-center p-2 text-gray-500 rounded-lg hover:bg-gray-100 hover:text-violet-700 cursor-pointer">
              <i class="fa-solid fa-exchange-alt w-5 h-5 mr-3"></i>
              <span>Switch Workspace</span>
            </a>
            <a (click)="logout()" class="flex items-center p-2 text-gray-500 rounded-lg hover:bg-gray-100 hover:text-violet-700 cursor-pointer">
              <i class="fa-solid fa-sign-out-alt w-5 h-5 mr-3"></i>
              <span>Logout</span>
            </a>
          </div>
        </li>
      </ul>
    </div>

  </div>
</aside>
