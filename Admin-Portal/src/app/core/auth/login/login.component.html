<div class="min-h-screen w-full flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-gray-700 via-gray-900 to-black">
  <!-- Animated Background -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute -top-48 -right-48 w-96 h-96 bg-blue-500 rounded-full opacity-10 animate-pulse"></div>
    <div class="absolute -bottom-48 -left-48 w-96 h-96 bg-indigo-500 rounded-full opacity-10 animate-pulse" style="animation-delay: 2s;"></div>
  </div>

  <!-- Centered Card -->
  <div class="w-full max-w-md bg-white/10 backdrop-blur-sm rounded-2xl p-8 shadow-2xl relative z-10 border border-white/20">
    
    <!-- Logo and Title -->
    <div class="mb-8 text-center">
      <div class="flex items-center justify-center gap-3 mb-4">
        <div class="relative w-10 h-10 bg-gradient-to-r from-blue-500 to-indigo-500 rounded-full flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <span class="text-2xl font-semibold text-white">Outreach-Hub</span>
      </div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent mb-2">Admin Portal</h1>
      <p class="text-gray-400">Sign in to manage the platform.</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your admin email"
          class="w-full px-4 py-3 bg-white/10 border-2 border-gray-500 rounded-xl text-white placeholder-gray-400 transition-all duration-200 focus:outline-none focus:border-blue-500 focus:shadow-lg focus:shadow-blue-500/20 focus:-translate-y-0.5 hover:border-gray-400"
          [class.border-red-500]="email?.invalid && email?.touched"
        />
        <div class="mt-1 text-xs text-red-400 font-medium" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required</span>
          <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-full px-4 py-3 bg-white/10 border-2 border-gray-500 rounded-xl text-white placeholder-gray-400 transition-all duration-200 focus:outline-none focus:border-blue-500 focus:shadow-lg focus:shadow-blue-500/20 focus:-translate-y-0.5 hover:border-gray-400"
          [class.border-red-500]="password?.invalid && password?.touched"
        />
        <div class="mt-1 text-xs text-red-400 font-medium" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <!-- Sign in button -->
      <button
        type="submit"
        class="w-full py-3.5 px-6 bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-semibold rounded-xl transition-all duration-300 ease-out transform hover:-translate-y-0.5 hover:shadow-xl hover:shadow-blue-500/30 active:translate-y-0 disabled:opacity-70 disabled:cursor-not-allowed relative overflow-hidden group"
        [disabled]="isLoading"
      >
        <div class="absolute inset-0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000 bg-gradient-to-r from-transparent via-white/20 to-transparent skew-x-12"></div>
        <span *ngIf="!isLoading" class="relative z-10">Sign In</span>
        <div *ngIf="isLoading" class="flex items-center justify-center">
          <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        </div>
      </button>
    </form>
  </div>
</div>
