<aside
  class="bg-gray-800 p-6 shadow-lg z-10 h-screen fixed transition-all duration-300 ease-in-out overflow-hidden"
  [ngClass]="(isSidebarCollapsed$ | async) ? 'w-20' : 'w-64'">

  <div class="flex flex-col justify-between h-full">

    <!-- Logo + Toggle -->
    <div>
      <div class="flex items-center mb-8 relative">
        <button
          (click)="toggleSidebar()"
          class="bg-transparent border-none cursor-pointer text-gray-400 p-2 rounded-full transition-colors duration-200 ease-in-out hover:bg-gray-700 w-6 h-6 flex items-center justify-center">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>

        <div class="ml-4 transition-opacity duration-300 ease-in-out"
          [ngClass]="{'opacity-0 pointer-events-none': (isSidebarCollapsed$ | async)}">
          <h1 class="text-xl font-bold text-gray-100 whitespace-nowrap">Outreach Hub</h1>
          <p class="text-sm text-gray-500 whitespace-nowrap">Admin Portal</p>
        </div>
      </div>

      <!-- Main Menu -->
      <nav>
        <h2 class="text-xs text-gray-400 font-semibold uppercase mb-4 transition-opacity duration-300 ease-in-out"
          [ngClass]="{'opacity-0 pointer-events-none': (isSidebarCollapsed$ | async)}">
          Main Menu
        </h2>
        <ul class="list-none p-0 m-0">

          <!-- Dashboard -->
          <li class="mb-2">
            <a routerLink="/dashboard" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #dashboardRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-700"
              [ngClass]="{
                'bg-blue-500/20 text-blue-400 font-semibold': dashboardRla.isActive, 
                'text-gray-400': !dashboardRla.isActive, 'p-3': !(isSidebarCollapsed$ | async),
                'p-2 justify-center': (isSidebarCollapsed$ | async)
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-blue-500 rounded-lg"
                [ngClass]="{'hidden': !dashboardRla.isActive}"></span>
              <svg class="w-5 h-5 transition-colors duration-300 ease-in-out"
                [ngClass]="{
                  'text-blue-400': dashboardRla.isActive, 
                  'text-gray-400': !dashboardRla.isActive,
                  'mr-3': !(isSidebarCollapsed$ | async)
                }"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001 1h3v-3m0 0a1 1 0 001-1V9a1 1 0 00-1-1h-3.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 00-.293.707V15a1 1 0 001 1h12m-6 0v2"></path>
              </svg>
              <span *ngIf="!(isSidebarCollapsed$ | async)">Dashboard</span>
            </a>
          </li>

          <!-- Workspaces -->
          <li class="mb-2">
            <a routerLink="/workspaces" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #workspacesRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-700"
              [ngClass]="{
                'bg-blue-500/20 text-blue-400 font-semibold': workspacesRla.isActive, 
                'text-gray-400': !workspacesRla.isActive, 'p-3': !(isSidebarCollapsed$ | async),
                'p-2 justify-center': (isSidebarCollapsed$ | async)
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-blue-500 rounded-lg"
                [ngClass]="{'hidden': !workspacesRla.isActive}"></span>
              <i class="fa-solid fa-briefcase w-5 h-5 transition-colors duration-300 ease-in-out"
                [ngClass]="{
                  'text-blue-400': workspacesRla.isActive, 
                  'text-gray-400': !workspacesRla.isActive,
                  'mr-3': !(isSidebarCollapsed$ | async)
                }">
              </i>
              <span *ngIf="!(isSidebarCollapsed$ | async)">Workspaces</span>
            </a>
          </li>

          <!-- Users -->
          <li class="mb-2">
            <a routerLink="/users" routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }" #usersRla="routerLinkActive"
              class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-700"
              [ngClass]="{
                'bg-blue-500/20 text-blue-400 font-semibold': usersRla.isActive, 
                'text-gray-400': !usersRla.isActive, 'p-3': !(isSidebarCollapsed$ | async),
                'p-2 justify-center': (isSidebarCollapsed$ | async)
              }">
              <span class="absolute left-0 top-0 h-full w-1 bg-blue-500 rounded-lg"
                [ngClass]="{'hidden': !usersRla.isActive}"></span>
              <i class="fa-solid fa-users w-5 h-5 transition-colors duration-300 ease-in-out"
                [ngClass]="{
                  'text-blue-400': usersRla.isActive, 
                  'text-gray-400': !usersRla.isActive,
                  'mr-3': !(isSidebarCollapsed$ | async)
                }">
              </i>
              <span *ngIf="!(isSidebarCollapsed$ | async)">Users</span>
            </a>
          </li>

        </ul>
      </nav>
    </div>

    <!-- System Section -->
    <div>
      <h2 class="text-xs text-gray-400 font-semibold uppercase mb-4 transition-opacity duration-300 ease-in-out"
        [ngClass]="{'opacity-0 pointer-events-none': (isSidebarCollapsed$ | async)}">
        System
      </h2>
      <ul class="list-none p-0 m-0">
        <li class="mb-2">
          <a (click)="logout()"
            class="flex items-center rounded-lg transition-colors duration-150 ease-in-out relative font-medium hover:bg-gray-700 cursor-pointer text-gray-400"
            [ngClass]="{
              'p-3': !(isSidebarCollapsed$ | async), 'p-2 justify-center': (isSidebarCollapsed$ | async)
            }">
            <i class="fa-solid fa-sign-out-alt w-5 h-5 transition-colors duration-300 ease-in-out"
               [ngClass]="{'mr-3': !(isSidebarCollapsed$ | async)}">
            </i>
            <span *ngIf="!(isSidebarCollapsed$ | async)">Logout</span>
          </a>
        </li>
      </ul>
    </div>

  </div>
</aside>
