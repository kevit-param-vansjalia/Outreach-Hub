<div class="p-6 md:p-8 min-h-screen">
  <!-- Header -->
  <div class="flex items-center justify-between pb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-100">Workspaces</h1>
      <p class="text-gray-400 mt-1">Manage all workspaces on the platform.</p>
    </div>
    <div>
      <button (click)="openModal()"
        class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition-colors duration-200">
        <i class="fa-solid fa-plus mr-2"></i>New Workspace
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="mb-8">
    <div class="border-b border-gray-700">
      <nav class="-mb-px flex space-x-6" aria-label="Tabs">
        <button (click)="activeTab = 'my'"
          [ngClass]="activeTab === 'my' ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-500'"
          class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
          My Workspaces
        </button>
        <button (click)="activeTab = 'all'"
          [ngClass]="activeTab === 'all' ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-400 hover:text-gray-200 hover:border-gray-500'"
          class="whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">
          All Workspaces
        </button>
      </nav>
    </div>
  </div>

  <!-- Workspace Cards -->
  <ng-container [ngSwitch]="activeTab">
    <!-- My Workspaces View -->
    <div *ngSwitchCase="'my'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" [@cardAnimation]="myWorkspaces.length">
      <div *ngFor="let workspace of myWorkspaces" class="bg-gray-800 rounded-lg shadow-lg overflow-hidden transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20 cursor-pointer">
        <div class="p-6">
          <h2 class="text-xl font-bold text-gray-100 truncate">{{ workspace.name }}</h2>
          <p class="text-sm text-gray-400 mt-2">ID: {{ workspace._id }}</p>
        </div>
      </div>
      <p *ngIf="myWorkspaces.length === 0" class="text-center text-gray-400 mt-16 col-span-full">You have not created any workspaces yet.</p>
    </div>

    <!-- All Workspaces View -->
    <div *ngSwitchCase="'all'" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" [@cardAnimation]="allWorkspaces.length">
      <div *ngFor="let workspace of allWorkspaces" class="bg-gray-800 rounded-lg shadow-lg overflow-hidden transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20 cursor-pointer">
        <div class="p-6">
          <h2 class="text-xl font-bold text-gray-100 truncate">{{ workspace.name }}</h2>
          <p class="text-sm text-gray-400 mt-2">ID: {{ workspace._id }}</p>
        </div>
      </div>
      <p *ngIf="allWorkspaces.length === 0" class="text-center text-gray-400 mt-16 col-span-full">No workspaces found on the platform.</p>
    </div>
  </ng-container>
</div>

<!-- Add Workspace Modal -->
<div *ngIf="isModalOpen" class="fixed inset-0 bg-black bg-opacity-50 z-40 flex items-center justify-center" (click)="closeModal()">
  <div class="bg-gray-800 rounded-lg shadow-2xl w-full max-w-lg m-4" (click)="$event.stopPropagation()">

    <!-- Step 1: Workspace Details -->
    <ng-container *ngIf="modalStep === 'details'">
      <div class="flex justify-between items-center p-5 border-b border-gray-700">
        <h3 class="text-xl font-semibold text-gray-100">Create New Workspace</h3>
        <button (click)="closeModal()" class="text-gray-400 bg-transparent hover:bg-gray-600 hover:text-gray-100 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center">
          <i class="fa-solid fa-times w-5 h-5"></i>
        </button>
      </div>
      <form [formGroup]="workspaceForm" (ngSubmit)="onSubmit()">
        <div class="p-6 space-y-6">
          <div>
            <label for="name" class="block mb-2 text-sm font-medium text-gray-300">Workspace Name</label>
            <input type="text" id="name" formControlName="name" class="w-full px-4 py-3 bg-gray-700 border-2 border-gray-600 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-500" placeholder="e.g. Q1 Marketing">
          </div>
          <div>
            <button type="button" (click)="goToUserSelection()" class="w-full py-3 px-6 bg-gray-700 text-white font-semibold rounded-xl hover:bg-gray-600">
              Add Users to Workspace
            </button>
          </div>
        </div>
        <div class="flex items-center p-6 space-x-2 border-t border-gray-700 rounded-b">
          <button type="submit" [disabled]="workspaceForm.invalid" class="w-full py-3 px-6 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
            Create Workspace
          </button>
          <button type="button" (click)="closeModal()" class="w-full py-3 px-6 bg-gray-600 text-white font-semibold rounded-xl hover:bg-gray-500">
            Cancel
          </button>
        </div>
      </form>
    </ng-container>

    <!-- Step 2: User Selection -->
    <ng-container *ngIf="modalStep === 'users'">
      <div class="flex justify-between items-center p-5 border-b border-gray-700">
        <h3 class="text-xl font-semibold text-gray-100">Add Users</h3>
        <button (click)="closeModal()" class="text-gray-400 bg-transparent hover:bg-gray-600 hover:text-gray-100 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center">
          <i class="fa-solid fa-times w-5 h-5"></i>
        </button>
      </div>
      <form [formGroup]="userSelectionForm">
        <div class="p-6 space-y-4 max-h-96 overflow-y-auto">
          <div *ngFor="let user of allUsers; let i = index" [formGroupName]="i" class="flex items-center justify-between p-3 bg-gray-700 rounded-lg">
            <div class="flex items-center">
              <input type="checkbox" [formControlName]="'selected'" class="w-5 h-5 text-blue-600 bg-gray-600 border-gray-500 rounded focus:ring-blue-500">
              <div class="ml-4">
                <p class="font-medium text-gray-100">{{ user.name }}</p>
                <p class="text-sm text-gray-400">{{ user.email }}</p>
              </div>
            </div>
            <div class="flex items-center space-x-4 text-sm text-gray-300">
              <label class="flex items-center">
                <input type="radio" value="Editor" name="role-{{i}}" (change)="setRole(i, 'Editor')" [checked]="userSelectionArray.at(i).get('role')?.value === 'Editor'" class="w-4 h-4 text-blue-600 bg-gray-600 border-gray-500 focus:ring-blue-500">
                <span class="ml-2">Editor</span>
              </label>
              <label class="flex items-center">
                <input type="radio" value="Viewer" name="role-{{i}}" (change)="setRole(i, 'Viewer')" [checked]="userSelectionArray.at(i).get('role')?.value === 'Viewer'" class="w-4 h-4 text-blue-600 bg-gray-600 border-gray-500 focus:ring-blue-500">
                <span class="ml-2">Viewer</span>
              </label>
            </div>
          </div>
        </div>
        <div class="flex items-center p-6 space-x-2 border-t border-gray-700 rounded-b">
          <button type="button" (click)="goToWorkspaceDetails()" class="w-full py-3 px-6 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700">
            Add to Workspace
          </button>
        </div>
      </form>
    </ng-container>

  </div>
</div>
