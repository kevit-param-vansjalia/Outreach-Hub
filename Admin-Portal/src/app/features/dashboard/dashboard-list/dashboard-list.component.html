<div class="p-6 md:p-8 min-h-screen">
  <!-- Header -->
  <div class="flex items-center justify-between pb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-100">Admin Dashboard</h1>
      <p class="text-gray-400 mt-1">Overview of the entire platform.</p>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
    <!-- Total Users -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg flex items-center justify-between transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20">
      <div>
        <h3 class="text-sm font-medium text-gray-400">Total Users</h3>
        <p class="text-3xl font-bold text-gray-100 mt-2">{{ totalUsers }}</p>
      </div>
      <div class="bg-blue-500/20 p-3 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-users h-6 w-6 text-blue-400"></i>
      </div>
    </div>

    <!-- Total Revenue -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg flex items-center justify-between transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20">
      <div>
        <h3 class="text-sm font-medium text-gray-400">Total Workspaces</h3>
        <p class="text-3xl font-bold text-gray-100 mt-2">{{ totalWorkspaces }}</p>
      </div>
      <div class="bg-blue-500/20 p-3 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-briefcase h-6 w-6 text-blue-400"></i>
      </div>
    </div>

    <!-- Active Subscriptions -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg flex items-center justify-between transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20">
      <div>
        <h3 class="text-sm font-medium text-gray-400">New Users (Today)</h3>
        <p class="text-3xl font-bold text-gray-100 mt-2">{{ newUsersToday }}</p>
      </div>
      <div class="bg-blue-500/20 p-3 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-user-plus h-6 w-6 text-blue-400"></i>
      </div>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- Users Created Chart -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20">
      <h3 class="text-lg font-semibold text-gray-100 mb-4">New Users Over Time</h3>
      <div *ngIf="userChartData.length > 0" class="chart-container">
        <ngx-charts-bar-vertical
          [scheme]="colorScheme"
          [results]="userChartData"
          [legend]="legend"
          [xAxis]="xAxis"
          [yAxis]="yAxis"
          [showXAxisLabel]="showXAxisLabel"
          [showYAxisLabel]="showYAxisLabel"
          [xAxisLabel]="xAxisLabel" 
          [yAxisLabel]="yAxisLabelUsers"
          (select)="onSelect($event)">
        </ngx-charts-bar-vertical>
      </div>
    </div>

    <!-- Workspaces Created Chart -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg transform transition-transform duration-300 hover:-translate-y-1 hover:shadow-blue-500/20">
      <h3 class="text-lg font-semibold text-gray-100 mb-4">New Workspaces Over Time</h3>
      <div *ngIf="workspaceChartData.length > 0" class="chart-container">
        <ngx-charts-area-chart
          [scheme]="colorScheme"
          [results]="workspaceChartData"
          [legend]="legend"
          [xAxis]="xAxis"
          [yAxis]="yAxis"
          [showXAxisLabel]="showXAxisLabel"
          [showYAxisLabel]="showYAxisLabel"
          [xAxisLabel]="xAxisLabel"
          [yAxisLabel]="yAxisLabelWorkspaces"
          [timeline]="timeline"
          (select)="onSelect($event)">
        </ngx-charts-area-chart>
      </div>
    </div>
  </div>
</div>
